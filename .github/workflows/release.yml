name: Release

# Publishes to PyPI when a version tag (v1.0.0, ...) is pushed. Uses PyPI "trusted publishing":
# no token is stored anywhere; the PyPI project must list this repository and workflow as a trusted publisher.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/backlog_digest/__init__.py').read())[1])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
