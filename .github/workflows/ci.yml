name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Types (mypy)
        run: mypy
      - name: Tests (pytest)
        run: pytest
      - name: Smoke test — doctor in 4 languages
        shell: bash
        env:
          BACKLOG_DIGEST_HOME: ${{ runner.temp }}/bd-home
          PYTHONIOENCODING: utf-8
        run: |
          for lang in uk en fr es; do backlog-digest --lang "$lang" doctor --offline; done
          bdig --version
