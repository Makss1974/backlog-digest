readme = """# backlog-digest — хмарна тека

Це дані програми backlog-digest (база, налаштування) і конспекти (тека `notes/`).
Щодня о {time} (ваш час) GitHub сам запускає програму: оновлює списки, робить конспекти й записує їх сюди.

## Як підключити (один раз)

1. На github.com: **New repository** → назва будь-яка → **Private** → Create (без README).
2. У цій теці: `git remote add origin <адреса>` і `git push -u origin main`.
3. Репозиторій → **Settings → Secrets and variables → Actions → New repository secret**:
   {secrets} — які маєте (хоча б один ключ моделі), а також `RAINDROP_TOKEN`, якщо користуєтеся Raindrop.
4. **Actions → backlog-digest → Run workflow** — перша перевірка.

## Як давати завдання

**Actions → backlog-digest → Run workflow**, з комп'ютера чи з телефону (застосунок GitHub):
- *add* — посилання через пробіл: плейлист чи відео YouTube, `t.me/канал`, стаття;
- *limit* — скільки елементів зробити цього разу (порожнє — як у налаштуваннях).

## На комп'ютері

`bdig --home <ця тека>` — програма сама забирає зміни з GitHub перед роботою й надсилає свої після.
Конспекти — у `notes/`: відкрийте її в Obsidian як сховище або тримайте цю теку всередині свого сховища.
Теки з книгами й експорт Telegram у хмарі не обробляються — їх робить комп'ютер.

## Важливо

- Репозиторій має бути **приватним**: тут ваші списки й конспекти.
- Безкоштовно GitHub дає 2000 хвилин на місяць для приватних репозиторіїв; ~20 конспектів на день
  займають приблизно 300–600 хвилин на місяць.
- З серверів GitHub YouTube часто не віддає субтитри — тоді відео «дивиться» Gemini (менший ліміт на день).
"""
