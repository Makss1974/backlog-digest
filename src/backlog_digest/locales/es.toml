path_config = "Ajustes"
path_secrets = "Claves (.env)"
path_data = "Datos (base, caché)"
saved = "Guardado: {path}"

[answers]
yes = ["s", "sí", "si", "y", "yes"]
yes_no_hint = "s/n"

[config]
file_header = "Ajustes de backlog-digest. Las claves de los modelos no se guardan aquí — están en el archivo .env de al lado."
err_syntax = "error en {file}: {detail}. La causa habitual es texto sin comillas; ponga el valor entre comillas \"...\"."
err_read = "no se puede leer {file}: {detail}"
err_ui_language = "el idioma de interfaz «{value}» no está disponible; posibles: {allowed}"
