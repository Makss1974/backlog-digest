data_dir = "Carpeta de datos"
not_writable = "no se puede escribir en {path}: {detail}"
database = "Base de datos"
database_detail = "esquema v{version}, {items}"
key = "Clave de {service}"
key_from_env = "variable de entorno"
key_from_file = "archivo .env"
key_set = "{name} definida ({where})"
key_not_set = "{name} no está definida"
model_keys = "Claves de modelos"
no_model_key = "ninguna clave de modelo — necesaria para los resúmenes (etapa 2). Archivo: {file}"
network = "Red"
network_ok = "accesible: {hosts}"
network_none = "sin conexión a Internet (o la bloquea un cortafuegos o proxy)"
