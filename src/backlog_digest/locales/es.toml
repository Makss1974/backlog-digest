err_output_kind = "output.kind = «{value}»; posibles: {allowed}"
err_positive_int = "{name} debe ser un número entero mayor que cero (ahora: {value})"

[doctor]
header = "backlog-digest {version} — diagnóstico"
python = "Python"
python_old = "{version} — se necesita Python 3.11 o posterior"
config = "Ajustes"
config_missing = "aún no hay archivo, se creará en el primer inicio: {path}"
languages = "Idiomas"
