# Español. Las claves deben coincidir en todos los idiomas (lo comprueba tests/test_i18n.py).
# {nombre} es un parámetro — no lo traduzcas.

[meta]
name = "Español"

[app]
title = "backlog-digest {version}"

[format]
label_value = "{label}: {value}"

[menu]
stats = "Estadísticas"
sources = "Fuentes: YouTube, carpetas, artículos"
summaries = "Crear resúmenes"
sorting = "Ordenar por temas + informe"
raindrop = "Exportar a Raindrop.io"
schedule = "Programación"
doctor = "Diagnóstico (doctor)"
settings = "Ajustes"
quit = "Salir"
back = "Volver"
prompt = "Su elección:"
no_such_item = "No existe esa opción."
press_enter = "Pulse Enter para volver al menú..."
interrupted = "Interrumpido. El progreso está guardado."
queue_empty = "la cola está vacía"
queue = "{done} de {total} listos, {queued} en cola"
coming_soon = "Aún no está listo — llegará en la etapa {stage}."
enter_number = "Introduzca un número del {lo} al {hi}."
opened = "Abierto: {path}"

[stats]
title = "Estadísticas"
sources = "Fuentes"
items = "Elementos"
no_sources = "Aún no hay fuentes. Añadir fuentes llegará en la etapa 2."

[status]
new = "nuevos"
done = "listos"
no_text = "sin texto"
error = "error (se reintentará)"
failed = "fallidos (3 intentos)"

[settings]
title = "Ajustes"
ui_language = "Idioma de la interfaz"
summary_language = "Idioma de los resúmenes"
show_paths = "Dónde guarda el programa sus archivos"
open_config_dir = "Abrir la carpeta de ajustes"
choose = "Número"
