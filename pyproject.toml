[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "backlog-digest"
dynamic = ["version"]     # з src/backlog_digest/__init__.py — одне місце для номера версії
description = "Turn your backlog of saved videos, articles, books and posts into a readable library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Makss1974" }]
keywords = ["summary", "youtube", "obsidian", "bookmarks", "raindrop", "llm", "gemini", "reading-list"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Text Processing :: General",
    "Topic :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Natural Language :: Ukrainian",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: Spanish",
]
# Моделі — через вбудований HTTP Python (без пакета openai).
dependencies = [
    "yt-dlp>=2025.1.1",                 # списки відео з плейлистів і каналів
    "youtube-transcript-api>=1.2,<2",   # субтитри
    "pypdf>=5",                         # текст із PDF
    "trafilatura>=2,<3",                # основний текст веб-статей
]

[project.urls]
Homepage = "https://github.com/Makss1974/backlog-digest"
Documentation = "https://github.com/Makss1974/backlog-digest#readme"
FAQ = "https://github.com/Makss1974/backlog-digest/blob/main/docs/FAQ.md"
Changelog = "https://github.com/Makss1974/backlog-digest/blob/main/CHANGELOG.md"
Issues = "https://github.com/Makss1974/backlog-digest/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
whisper = ["faster-whisper>=1.1"]   # розпізнавання мовлення на цьому комп'ютері (≈100 МБ)

[project.scripts]
backlog-digest = "backlog_digest.cli:main"
bdig = "backlog_digest.cli:main"

[tool.hatch.version]
path = "src/backlog_digest/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "README.uk.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/backlog_digest"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]   # необов'язкова: однаково — встановлена вона чи ні
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff.lint.per-file-ignores]
"tests/test_library.py" = ["F811"]
"tests/test_export.py" = ["F811"]
"tests/test_schedule.py" = ["F811"]
"tests/test_wizard.py" = ["F811"]   # фікстура env імпортується з test_pipeline
