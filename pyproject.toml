[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "backlog-digest"
version = "0.1.0.dev0"
description = "Turn your backlog of saved videos, articles, books and posts into a readable library."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "makss1974ustim" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Natural Language :: Ukrainian",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: Spanish",
]
# Моделі — через вбудований HTTP Python (без пакета openai).
dependencies = [
    "yt-dlp>=2025.1.1",                 # списки відео з плейлистів і каналів
    "youtube-transcript-api>=1.2,<2",   # субтитри
    "pypdf>=5",                         # текст із PDF
    "trafilatura>=2,<3",                # основний текст веб-статей
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
backlog-digest = "backlog_digest.cli:main"
bdig = "backlog_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_digest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/backlog_digest"]
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/test_library.py" = ["F811"]
"tests/test_export.py" = ["F811"]
"tests/test_schedule.py" = ["F811"]   # фікстура env імпортується з test_pipeline
